version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      build:
        patterns:
          - com.android.*
          - org.jetbrains.kotlin*
          - org.gradle.*
      androidx:
        patterns:
          - androidx.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - "*"
