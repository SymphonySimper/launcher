name: Bug report
description: Something in the launcher isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Settings → Report a bug fills this in.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
  - type: input
    id: phone
    attributes:
      label: Phone
